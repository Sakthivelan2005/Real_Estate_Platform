<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Floor Plan Creator</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            overflow-y: scroll;
        }

        header {
            background-color: #343a40;
            color: #fff;
            padding: 15px 0;
            text-align: center;
        }
        /* width */
  ::-webkit-scrollbar {
  width: 10px;
}

/* Track */
::-webkit-scrollbar-track {
  
  display: none;
}
 
/* Handle */
::-webkit-scrollbar-thumb {
  background: grey; 
  border-radius: 10px;
}

/* Handle on hover */
::-webkit-scrollbar-thumb:hover {
  background: rgba(12, 12, 15, 0.655); 
}

        h1 {
            margin: 0;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #canvas-container {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        canvas {
            border: 2px solid #ccc;
            background-color: #fff;
            cursor: crosshair;
        }

        #tools {
            width: 200px;
            background-color: #f8f9fa;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 5px;
        }

        #tools h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #343a40;
        }

        .tool {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .tool:hover {
            background-color: #0056b3;
        }

        .tool:focus {
            outline: none;
        }

        .resizable-handle {
            width: 10px;
            height: 10px;
            background-color: red;
            position: absolute;
            z-index: 1;
            display: none;
        }

        .resizable-container:hover .resizable-handle {
            display: block;
        }

        .rotate-handle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: green;
            position: absolute;
            z-index: 1;
            display: none;
        }

        .rotate-handle:hover {
            cursor: pointer;
        }

        .rotate-container:hover .rotate-handle {
            display: block;
        }
    </style>
</head>
<body>
<header>
    <h1>House Floor Plan Creator</h1>
</header>
<main>
    <div id="canvas-container">
        Create your dream villa by using our advanced tool
        <canvas id="canvas"></canvas>
    </div>
    <div id="tools">
        
<p id="total-square-footage">Total Square Footage: 0 sq. ft.</p>
        <h2>Tools</h2>
        <button id="horizontal-wall-tool" class="tool">Horizontal Wall</button>
        <button id="vertical-wall-tool" class="tool">Vertical Wall</button>
        <button id="door-tool" class="tool">Door</button>
        <button id="window-tool" class="tool">Window</button>
        <button id="erase-tool" class="tool">Erase</button>
        <button id="rotate-tool" class="tool">Rotate</button>
    </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const tools = document.querySelectorAll(".tool");
    const totalSquareFootageElement = document.getElementById("total-square-footage");

    canvas.width = window.innerWidth * 0.8;
    canvas.height = window.innerHeight - 100;

    let currentTool = null;
    let images = [];
    let selectedImage = null;

    let isResizing = false;
    let isRotating = false;
    let resizeIndex = -1;
    let rotateIndex = -1;

    const imageUrls = {
        "horizontal-wall": "jpg/Horizontal_wall_image.jpg",
        "vertical-wall": "jpg/vertical_wall_image.jpg",
        "door": "jpg/door_image.jpg",
        "window": "jpg/window_image.jpg"
    };

    function loadImage(url, callback) {
        const img = new Image();
        img.onload = () => callback(img);
        img.src = url;
    }

    function drawImages() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        images.forEach((img, index) => {
            ctx.save();
            ctx.translate(img.x + img.width / 2, img.y + img.height / 2);
            ctx.rotate(img.angle * Math.PI / 180);
            ctx.drawImage(img.image, -img.width / 2, -img.height / 2, img.width, img.height);
            ctx.restore();

            // Resize handle
            ctx.fillStyle = "red";
            ctx.fillRect(img.x + img.width - 5, img.y + img.height - 5, 10, 10);

            // Rotate handle (only when rotate tool selected)
            if (currentTool === "rotate") {
                ctx.fillStyle = "green";
                ctx.beginPath();
                ctx.arc(img.x + img.width / 2, img.y - 20, 10, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    function updateTotalSquareFootage() {
        let total = 0;
        images.forEach(img => total += img.width * img.height);
        totalSquareFootageElement.textContent =
            `Total Square Footage: ${Math.round(total)} sq. ft.`;
    }

    canvas.addEventListener("mousedown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // ERASE
        if (currentTool === "erase") {
            images = images.filter(img =>
                !(x >= img.x && x <= img.x + img.width &&
                  y >= img.y && y <= img.y + img.height)
            );
            drawImages();
            updateTotalSquareFootage();
            return;
        }

        // CHECK RESIZE
        images.forEach((img, i) => {
            if (
                x >= img.x + img.width - 5 &&
                x <= img.x + img.width + 5 &&
                y >= img.y + img.height - 5 &&
                y <= img.y + img.height + 5
            ) {
                isResizing = true;
                resizeIndex = i;
            }
        });

        // CHECK ROTATE
        if (currentTool === "rotate") {
            images.forEach((img, i) => {
                const cx = img.x + img.width / 2;
                const cy = img.y - 20;
                if (Math.hypot(x - cx, y - cy) <= 10) {
                    isRotating = true;
                    rotateIndex = i;
                }
            });
        }

        // PLACE NEW IMAGE
        if (selectedImage && !isResizing && !isRotating) {
            images.push({
                image: selectedImage,
                x,
                y,
                width: selectedImage.width,
                height: selectedImage.height,
                angle: 0
            });
            drawImages();
            updateTotalSquareFootage();
        }
    });

    canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (isResizing && resizeIndex !== -1) {
            const img = images[resizeIndex];
            img.width = Math.max(20, x - img.x);
            img.height = Math.max(20, y - img.y);
            drawImages();
            updateTotalSquareFootage();
        }

        if (isRotating && rotateIndex !== -1) {
            const img = images[rotateIndex];
            const cx = img.x + img.width / 2;
            const cy = img.y + img.height / 2;
            img.angle = Math.atan2(y - cy, x - cx) * 180 / Math.PI;
            drawImages();
        }
    });

    canvas.addEventListener("mouseup", () => {
        isResizing = false;
        isRotating = false;
        resizeIndex = -1;
        rotateIndex = -1;
    });

    tools.forEach(tool => {
        tool.addEventListener("click", () => {
            currentTool = tool.id.replace("-tool", "");
            if (imageUrls[currentTool]) {
                loadImage(imageUrls[currentTool], img => {
                    selectedImage = img;
                });
            } else {
                selectedImage = null;
            }
        });
    });
});
</script>
</body>

</html>
